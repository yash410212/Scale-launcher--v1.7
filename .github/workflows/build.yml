name: Build Scale UI Launcher v1.7

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project
        run: |
          set -euo pipefail
          unzip -q scaleui_v1_7_final_release_candidate.zip -d workspace
          test -f workspace/settings.gradle.kts
          test -d workspace/app
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Fix Compose source
        working-directory: workspace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          def add_import(rel, imp):
              p=root/rel; lines=p.read_text().splitlines()
              if imp not in lines:
                  i=next(i for i,x in enumerate(lines) if x.startswith('package ')); lines.insert(i+1,''); lines.insert(i+2,imp); p.write_text('\n'.join(lines)+'\n')
          def remove_import(rel, imp):
              p=root/rel; p.write_text('\n'.join(x for x in p.read_text().splitlines() if x.strip()!=imp)+'\n')
          for rel,imp in [
              ('app/src/main/java/com/scaleui/launcher/drawer/AppDrawerScreen.kt','import androidx.compose.ui.input.pointer.pointerInput'),
              ('app/src/main/java/com/scaleui/launcher/drawer/AppDrawerScreen.kt','import androidx.compose.foundation.layout.Box'),
              ('app/src/main/java/com/scaleui/launcher/drawer/AppDrawerScreen.kt','import androidx.compose.foundation.layout.size'),
              ('app/src/main/java/com/scaleui/launcher/drawer/DrawerIcon.kt','import androidx.compose.ui.draw.scale'),
              ('app/src/main/java/com/scaleui/launcher/drawer/DrawerSearchBar.kt','import androidx.compose.ui.draw.clip'),
              ('app/src/main/java/com/scaleui/launcher/drawer/DrawerSearchBar.kt','import androidx.compose.foundation.clickable'),
              ('app/src/main/java/com/scaleui/launcher/zeroscreen/ZeroScreenScreen.kt','import androidx.compose.foundation.layout.height')]: add_import(rel,imp)
          p=root/'app/src/main/java/com/scaleui/launcher/home/PreSetupHomeScreen.kt'; p.write_text(p.read_text().replace('Modifier.weight(1f).height(54.dp)','Modifier.height(54.dp)')); remove_import('app/src/main/java/com/scaleui/launcher/home/PreSetupHomeScreen.kt','import androidx.compose.foundation.layout.weight')
          # SettingsScreen: dependency exists, so fully qualify the composable and vector.
          p=root/'app/src/main/java/com/scaleui/launcher/settings/SettingsScreen.kt'; t=p.read_text().replace('Icon(\n                        imageVector = Check,','androidx.compose.material3.Icon(\n                        imageVector = androidx.compose.material.icons.Icons.Filled.Check,'); p.write_text(t)
          # GlassSurface: remove unsupported outline implementation and use a simple rectangular border.
          p=root/'app/src/main/java/com/scaleui/launcher/theme/GlassSurface.kt'; t=p.read_text()
          t=t.replace('import androidx.compose.ui.graphics.Stroke\n','').replace('import androidx.compose.ui.graphics.drawscope.Stroke\n','').replace('import androidx.compose.ui.geometry.CornerRadius\n','')
          t=t.replace('                val outline = shape.createOutline(size, layoutDirection, this)\n','')
          start=t.find('                    // One clean outline is cheaper and visually calmer than stacking borders.')
          end=t.find('                    drawContent()', start)
          if start >= 0:
              # Keep content; replace the outline drawing section later via direct textual cleanup.
              pass
          import re
          t=re.sub(r'\n\s*// One clean outline is cheaper and visually calmer than stacking borders\.\n\s*when \{.*?\n\s*\}\n\s*if \(config\.innerHighlightAlpha > 0f\) \{.*?\n\s*\}', '', t, flags=re.S)
          p.write_text(t)
          PY
      - name: Build APK
        working-directory: workspace
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon
      - name: Sign and verify APK
        working-directory: workspace
        run: |
          set -euo pipefail
          APK=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          KEYSTORE="$RUNNER_TEMP/scaleui-v17-debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android -alias scaleui -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Scale UI Launcher v1.7, OU=Debug, O=Scale UI, C=IN' -noprompt
          ALIGNED="${APK%.apk}-aligned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias scaleui --out "$APK" "$ALIGNED"
          rm -f "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScaleUI-v1.7-debug-apk-signed
          path: workspace/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
